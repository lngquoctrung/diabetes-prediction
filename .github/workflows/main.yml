name: Deploy to EC2

on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to EC2
      run: |
        ssh ${{ secrets.USERNAME }}@${{ secrets.HOST }} << 'EOF'
          # Redirect to service folder
          cd /home/ubuntu/services

          # Clone project if project folder does not exist
          if [ ! -d "diabetes-prediction-system" ]; then
            git clone git@github.com:lngquoctrung/diabetes-prediction.git ~/services/diabetes-prediction-system
          fi

          # Redirect to project folder
          cd diabetes-prediction-system

          # Remove old version
          docker stop diabetes-prediction-system || true
          docker rm diabetes-prediction-system || true
          docker image rm diabetes-prediction:latest || true
          
          # Create new image and run container
          docker build -t diabetes-prediction:latest .
          docker run -d --name diabetes-prediction-system -p 7860:7860 diabetes-prediction:latest

          # Remove root folder release memory of server
          cd ..
          rm -rf diabetes-prediction-system
        EOF
